name: Build Gale Windows (PR 728)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout PR 728 source
        uses: actions/checkout@v4
        with:
          repository: AzumattDev/gale
          ref: 28b06daf35ca7277f4111c57ab8ecd67060b7d38

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
          # GitHub's Windows runner includes the MSVC build tools and WebView2.

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Gale
        run: pnpm tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Gale-Windows-PR728
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
